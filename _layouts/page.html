---
layout: default
---
<!-- page.html -->
<div class="space-y-6">

  <header class="space-y-2">
    <h1 class="text-3xl font-semibold tracking-tight">{{ page.title }}</h1>
    {% if page.description %}<p class="text-muted-foreground">{{ page.description }}</p>{% endif %}
  </header>

  <article {% unless page.prose == false %}class="prose prose-neutral max-w-none dark:prose-invert [&_iframe]:max-w-full"{% endunless %}>
    {{ content }}
  </article>

</div>
