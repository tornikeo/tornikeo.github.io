{% assign extension = include.path | split: '.' | last | downcase %}
{% if extension == "mp4" or extension == "webm" or extension == "ogg" %}
  <video class="block w-full object-contain" style="aspect-ratio: {{ include.ratio | default: '16/9' }}" data-preview-src="{{ include.clip | default: include.path | relative_url }}" {% if include.preview %}poster="{{ include.preview | relative_url }}"{% endif %} muted playsinline loop preload="none" aria-label="{{ include.alt | escape }}"></video>
{% else %}
  {% assign image = include.preview | default: include.path %}
  <img class="block aspect-video w-full {% if image contains '.svg' %}bg-white object-contain{% else %}object-cover{% endif %}" src="{{ image | relative_url }}" alt="{{ include.alt | escape }}" loading="lazy">
{% endif %}
