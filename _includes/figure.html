{% assign image_url = include.path | relative_url %}
{% assign image_label = include.alt | default: include.caption | default: page.title | strip_html %}
<figure>
  {% if include.zoomable %}
    <div data-image-zoom>
      <a href="{{ image_url }}" aria-label="Enlarge image">
        <img class="mx-auto max-w-full rounded-lg" src="{{ image_url }}" alt="{{ image_label | escape }}" loading="lazy">
      </a>
    </div>
  {% else %}
    <img class="mx-auto max-w-full rounded-lg" src="{{ image_url }}" alt="{{ image_label | escape }}" loading="lazy">
  {% endif %}
  {% if include.caption %}<figcaption class="text-center">{{ include.caption }}</figcaption>{% endif %}
</figure>
