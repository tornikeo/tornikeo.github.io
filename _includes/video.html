<figure>
  <video
    class="mx-auto max-w-full rounded-lg"
    src="{{ include.path | relative_url }}"
    width="{{ include.width | default: '100%' }}"
    {% if include.height %}height="{{ include.height }}"{% endif %}
    controls loop muted playsinline preload="metadata"
    aria-label="{{ include.caption | default: page.title | strip_html | escape }}">
  </video>
  {% if include.caption %}<figcaption class="text-center">{{ include.caption | markdownify }}</figcaption>{% endif %}
</figure>
