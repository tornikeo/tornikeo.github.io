<figure>
  <iframe
    class="w-full max-w-full rounded-lg border"
    src="{{ include.path | relative_url }}"
    title="{{ include.title | default: page.title | escape }}"
    height="{{ include.height | default: 900 }}"
    width="{{ include.width | default: '100%' }}"
    loading="lazy"
    allow="camera"
    allowfullscreen
    {% if include.style %}style="{{ include.style }}"{% endif %}>
  </iframe>
  {% if include.caption %}<figcaption class="text-center">{{ include.caption }}</figcaption>{% endif %}
</figure>
