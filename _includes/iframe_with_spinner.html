<iframe
  class="w-full max-w-full rounded-lg border"
  src="{{ include.src }}"
  title="{{ include.title | default: page.title | escape }}"
  height="{{ include.height | default: 1200 }}"
  width="{{ include.width | default: '100%' }}"
  loading="lazy"
  sandbox="allow-scripts"
  {% if include.allow %}allow="{{ include.allow }}"{% endif %}
  {% if include.style %}style="{{ include.style }}"{% endif %}>
</iframe>
