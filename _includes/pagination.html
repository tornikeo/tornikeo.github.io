{% if paginator.total_pages > 1 %}
<nav class="page-nav" aria-label="Writing pages">
  {% if paginator.previous_page %}
    <a href="{{ paginator.previous_page_path | relative_url }}" rel="prev">← Newer</a>
  {% endif %}
  {% for trail in paginator.page_trail %}
    {% if paginator.page == trail.num %}
      <span aria-current="page">{{ trail.num }}</span>
    {% else %}
      <a href="{{ trail.path | relative_url }}" aria-label="Page {{ trail.num }}">{{ trail.num }}</a>
    {% endif %}
  {% endfor %}
  {% if paginator.next_page %}
    <a href="{{ paginator.next_page_path | relative_url }}" rel="next">Older →</a>
  {% endif %}
</nav>
{% endif %}
