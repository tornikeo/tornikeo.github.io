{% if paginator.total_pages > 1 %}
<div data-blog-pagination data-current-url="{{ page.url | replace: 'index.html', '' | relative_url }}">
  <nav class="flex flex-wrap items-center justify-center gap-1 text-sm [&_a]:rounded-md [&_a]:px-3 [&_a]:py-2 [&_a:hover]:bg-muted" aria-label="Blog pages">
    {% if paginator.previous_page %}
      <a href="{{ paginator.previous_page_path | relative_url }}" rel="prev">← Newer</a>
    {% endif %}
    {% for trail in paginator.page_trail %}
      {% if paginator.page == trail.num %}
        <span class="rounded-md border bg-background px-3 py-2" aria-current="page">{{ trail.num }}</span>
      {% else %}
        <a href="{{ trail.path | relative_url }}" aria-label="Page {{ trail.num }}">{{ trail.num }}</a>
      {% endif %}
    {% endfor %}
    {% if paginator.next_page %}
      <a href="{{ paginator.next_page_path | relative_url }}" rel="next">Older →</a>
    {% endif %}
  </nav>
</div>
{% endif %}
